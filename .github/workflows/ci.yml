name: Gene pipeline CI
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  capture-public-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only on the runner
        run: |
          mkdir -p artifacts
          python -m pip install -e '.[test,ci]' 2>&1 | tee artifacts/install.log
      - name: Capture public reference responses and generate synthetic inputs
        run: python ci/record.py 2>&1 | tee artifacts/record.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-api-recordings
          path: |
            data/
            artifacts/
          retention-days: 14
